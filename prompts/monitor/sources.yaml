# 一次情報 監視ソース定義
# scripts/monitor.ts が毎日巡回し、変更を検知したら Issue を自動起票する。

sources:
  # ===== 入管・国際業務 (P0) =====
  - id: isa-news
    name: 出入国在留管理庁 新着情報
    url: https://www.moj.go.jp/isa/
    category: nyukan
    priority: P0
    checkFrequency: daily

  - id: isa-eiju-guideline
    name: 永住許可に関するガイドライン
    url: https://www.moj.go.jp/isa/applications/guide/
    category: nyukan
    subcategory: eiju
    priority: P0
    checkFrequency: daily
    note: 2026-08-04 改定案公表。パブコメ 2026-09-04 締切。施行は2027年4月見込み。

  - id: ikusei-shuro
    name: 育成就労制度 関連情報
    url: https://www.moj.go.jp/isa/
    category: nyukan
    subcategory: ikusei
    priority: P0
    checkFrequency: daily
    note: 2027-04 施行。運用要領は2026-04-06改正版が最新。

  # ===== パブリックコメント =====
  - id: egov-pubcomment
    name: e-Gov パブリックコメント
    url: https://public-comment.e-gov.go.jp/
    keywords: ["行政書士", "在留資格", "入管", "永住", "育成就労", "外国人"]
    priority: P0
    checkFrequency: daily

  # ===== 行政書士制度 =====
  - id: soumu-gyoseishoshi
    name: 総務省 行政書士制度
    url: https://www.soumu.go.jp/
    keywords: ["行政書士"]
    category: seido
    priority: P1
    checkFrequency: weekly
    note: 2026-01-01 施行の改正行政書士法（使命明文化・デジタル対応努力義務・両罰規定強化）

  - id: nichigyoren
    name: 日本行政書士会連合会
    url: https://www.gyosei.or.jp/
    category: seido
    priority: P1
    checkFrequency: weekly

  # ===== DX・電子申請 =====
  - id: digital-agency
    name: デジタル庁
    url: https://www.digital.go.jp/
    keywords: ["電子申請", "オンライン申請", "行政手続"]
    category: dx
    priority: P2
    checkFrequency: weekly

  # ===== 許認可（Phase 2以降） =====
  - id: mlit-kensetsu
    name: 国土交通省 建設業許可
    url: https://www.mlit.go.jp/
    category: kyoninka
    priority: P3
    checkFrequency: monthly

  # ===== 補助金（Phase 2以降） =====
  - id: jgrants
    name: jGrants 補助金ポータル
    url: https://www.jgrants-portal.go.jp/
    category: hojokin
    priority: P3
    checkFrequency: weekly

# 検知時のアクション
onChange:
  - createGithubIssue: true
  - labels: ["content-opportunity"]
  - assignPriority: fromSource
