      （e-Gov表示は9/4 0時0分）。適用: 2027-04-01以降の申請。ただし収入(第2の4(2))・公共の負担(第2の5(7))は
      改定日の6か月前以降の申請中案件にも適用（改定日未確定。概要は「収入は本年10月施行」）。
      改定内容: 年収=世帯人数対応の日本人世帯平均を継続的に超過 /
      年金=見込受給額を受給年金水準と比較 / 日本語=日本語教育の参照枠B1相当以上 /
      配偶者特例 婚姻3年・在留1年 → 婚姻5年・在留3年 / 実子等 1年→3年 /
      学齢期の子の就学 / 制度・ルール理解 / 出国 半年・通算2年6月。
      原文: data/sources/pubcomment-315000140/。現在ローンチ特集の対象。noticeLevel: draft-proposal。
      制度確定時は48時間以内更新ルールの適用対象。

