# =====================================================================
#  一次情報 監視ソース レジストリ  v2.1
#  行政書士 全業務分野 網羅版 / src/lib/sources/monitor.ts 互換
# =====================================================================
#  更新: 2026-08-20
#  検証: 全URLを実地確認済み。各エントリの status を必ず確認すること。
#  解説: docs/10_MONITORING_REGISTRY.md
#
#  ★設計原則 — 「収集」と「公開」は別物 ─────────────────────────
#    collectPriority (= priority) : 監視優先度。全8分野を初日から網羅する。
#                                   クロール費用はほぼゼロ。一次情報アーカイブは
#                                   蓄積した期間の分しか価値が生まれない。
#    publishPriority              : 記事化優先度。新規ドメインが8分野を薄く扱うと
#                                   どこでも上位に立てないため、狭く深く攻める。
#    → 現在 publish は nyukan のみ P0。他は「貯めるだけ」。
#  ─────────────────────────────────────────────────────────
#
#  【スキーマ互換について】
#  priority / checkFrequency は src/lib/sources/monitor.ts の
#  sourceSchema に合わせた必須フィールド。
#  それ以外（method, status, publishPriority, frequencyHint, baseUrl, docUrl,
#  related）は zod が読み捨てる拡張フィールドで、将来のパーサ分岐用。
#
#  method:
#    diff : HTML差分監視。現行 monitor.ts が処理する。enabled: true
#    rss  : RSSフィード。TASK-10 実装済み（src/lib/sources/rss.ts）— 新着 item のみ報告
#    api  : API。専用スクリプトで処理する。enabled: false
#
#  status:
#    confirmed  : 2026-08-17 に実際に取得・動作確認済み
#    listed     : 公式ページに記載があるが直接取得は未実施
#    unverified : 検索結果には存在するが未確認。使用前に要確認
#    blocked    : ボット遮断(403)等で確認不可。ブラウザで要確認
#
#  frequencyHint:
#    checkFrequency は monitor.ts の enum(daily|weekly|monthly)に丸めてある。
#    本来望ましい頻度が異なる場合のみ frequencyHint に記す（2x-daily / quarterly）。
# =====================================================================

version: 2.1
updated: "2026-08-20"

defaults:
  userAgent: "gyosei-times-monitor/1.0 (+https://example.jp/about)"
  minIntervalMs: 1000
  timeoutMs: 30000

onChange:
  createGithubIssue: true
  labels: ["content-opportunity"]
  assignPriority: fromSource

sources:
  # ===================================================================
  #  SECTION A — 横断ソース【最優先・全分野に効く】
  #  A群だけで全省庁の動きの8割を捕捉できる。
  # ===================================================================

  - id: egov-pubcomment-all
    name: e-Gov パブリックコメント 意見募集案件（全件）
    url: https://public-comment.e-gov.go.jp/rss/pcm_list.xml
    priority: P0
    checkFrequency: daily
    frequencyHint: 2x-daily
    category: crosscutting
    method: rss
    status: confirmed
    enabled: false
    publishPriority: P0
    note: >
      ★本プロジェクト最重要ソース。制度改正を「予告段階」で捕捉できる唯一の窓口。
      公式APIは存在しない（developer.e-gov.go.jp で不存在確認）が RSS が完備。
      ★enabled: false の理由 — 専用スクリプト scripts/watch-pubcomment.ts が
      すでにこの役割を担っているため。monitor.ts での二重監視は不要。
      ⚠️ ローリングウィンドウ型（実測で7件のみ）。1日2回ポーリング + 案件IDでdedupしないと
      案件が丸ごと消える。詳細URLは servlet 形式が2026-08現在も稼働:
      https://public-comment.e-gov.go.jp/servlet/Public?CLASSNAME=PCMMSTDETAIL&id={id}&Mode=0
      ⚠️ カテゴリ分類に「建設」「運輸」「医療」「法務」は存在しない。
      建設業許可は「建築、住宅」、入管は「外事」に散る → キーワードマッチ併用必須。
    keywords:
      [行政書士, 在留資格, 入管, 出入国, 永住, 帰化, 育成就労, 技能実習, 特定技能, 外国人,
       建設業, 宅地建物取引業, 産業廃棄物, 食品衛生, 風俗営業, 古物, 旅館業, 住宅宿泊, 酒類,
       運送事業, 相続, 遺言, 商業登記, 定款, 補助金, 自動車, 無人航空機, 動物取扱業,
       電気通信事業, 農地, 医療法人, 探偵業, 大麻草, 電子申請, 行政手続]

