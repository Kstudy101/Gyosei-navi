$(function() {
  $('.headerNaviDynBlock').each(function() {
    var block = $(this);
    var list = block.find('.headerNaviDynList');
    block.css('display', 'none');

    var url = block.attr('url');
    if (!url) {
      url = block.attr('data-url');
      if (!url) {
        return;
      }
    }

    $.getJSON(url, function(json) {
      var templateOrig = block.find('.headerNaviPageTemplate');
      if (templateOrig.length == 0) {
        return;
      }
      var template = templateOrig.clone().removeClass('headerNaviPageTemplate').addClass('pageEntity').css('display', '');
      block.find('.pageEntity').remove();
      var count = 0;
      for (var j=0; j<json.length; j++) {
        var item = json[j];
        if (item.is_category_index && item.child_pages_count == 0) {
          continue;
        }
        var entity = template.clone();
        entity.find('.pageLink').attr('href', item.url).text(item.page_name);
        entity.find('.pageDescription').text(item.description);
        list.append(entity);
        count++;
      }
      if (count > 0) {
        block.css('display', '');
      }
      templateOrig.remove();
    });
  });
});

  <script>
  function cmsDynDateFormat(date, format) {
    var jpWeek = ['譌･', '譛・, '轣ｫ', '豌ｴ', '譛ｨ', '驥・, '蝨・];
    return format.replace('%Y', date.getFullYear()).replace('%m', ('0' + (date.getMonth() + 1)).slice(-2)).replace('%d', ('0' + date.getDate()).slice(-2)).replace('%a', jpWeek[date.getDay()])
        .replace('%H', ('0' + date.getHours()).slice(-2)).replace('%M', ('0' + date.getMinutes()).slice(-2)).replace('%S', ('0' + date.getSeconds()).slice(-2));
  }
  function cmsDynExecuteGetPageList() {
    var outerBlocks = $('.pageListDynBlock');
    outerBlocks.each(function() {
      var block = $(this);
      block.find('.pageListExists').css('display', 'none');
      block.find('.pageListNotExists').css('display', 'none');

      var url = block.attr('data-url');

      var cond = {};

      cond.limit = parseInt(block.attr('data-limit'));
      cond.showIndex = parseInt(block.attr('data-show-index'));
      cond.showMobile = parseInt(block.attr('data-show-mobile'));
      dateBegin = block.attr('data-date-begin');
      dateSpan = block.attr('data-date-span');

      cond.curPageNo = block.attr('data-current-page-no');
      cond.dirClass = block.attr('data-dir-class');
      cond.pageClass = block.attr('data-page-class');

      cond.timeBegin = 0;
      if (dateBegin) {
        cond.timeBegin = new Date(dateBegin);
      } else if (dateSpan) {
        cond.timeBegin = Date.now() - dateSpan * 86400000;
      }
      var recentSpan = block.attr('data-recent-span');
      cond.recentBegin = 0;
      if (recentSpan) {
        cond.recentBegin = Date.now() - recentSpan * 86400000;
      }
      cond.dateFormat = block.attr('data-date-format');
      if (!cond.dateFormat) {
        cond.dateFormat = '%Y/%m/%d %H:%M:%S';
      }
      cond.joinGrue = block.attr('data-join-grue');
      if (!cond.joinGrue) {
        cond.joinGrue = ' , ';
      }
      cond.eventDateFormat = block.attr('data-event-date-format');
      if (!cond.eventDateFormat) {
        cond.eventDateFormat = cond.dateFormat;
      }
      cond.eventType = block.attr('data-event-type');
      cond.eventField = block.attr('data-event-field');
      cond.eventArea = block.attr('data-event-area');
      eventDateSpan = block.attr('data-event-date-span');
      cond.eventTimeEnd = 0;
      if (eventDateSpan) {
        cond.eventTimeEnd = Date.now() + eventDateSpan * 86400000;
      }

      // 繧ｿ繧ｰ
      cond.tagDisplay = block.attr('data-show-tags');
      cond.tagPosition = block.attr('data-tags-position');
      cond.tagFilterTargets = block.attr('data-tag-filter-targets');

      $.getJSON(url, function(json) {
        cmsDynApplyPageListJson(block, json, cond);
      }).fail(function(jqxhr, textStatus, error) {
        block.css('display', 'none');
      });
    });
  }
  function cmsDynApplyPageListJson(block, json, cond) {
    var now = Date.now();
    var list = block.find('.pageListBlock');
    var template = list.find('.pageEntity:first').clone();
    list.find('.pageEntity').remove();

    var count = 0;

    for (var i = 0; i < json.length; i++) {
      var item = json[i];
      var itemDate = new Date(item.publish_datetime);

      if (!cond.showIndex && item.is_category_index) {
        continue;
      }
      if (!cond.showMobile && item.is_keitai_page) {
        continue;
      }
      if (cond.timeBegin && itemDate.getTime() < cond.timeBegin) {
        continue;
      }

      // 繧ｿ繧ｰ縺ｫ繧医ｋ邨櫁ｾｼ縺ｿ
      if ('tag' in item && item.tag && cond.tagFilterTargets != null) {
        var filteringNos = (!isNaN(cond.tagFilterTargets)) ? [cond.tagFilterTargets] : cond.tagFilterTargets.split(/,|\s/);
        var isTarget = false;
        item.tag.forEach(function(tagItem, idx) {
          if (filteringNos.indexOf(tagItem.tag_no + "") >= 0) {
            isTarget = true;
          }
        });
        if (!isTarget) {
          continue;
        }
      }

      var entity = template.clone();
      if ('event' in item && item['event']) {
        var pageEvent = item['event'];
        if (cond.eventType && cond.eventType != pageEvent.event_type_name) {
          continue;
        }
        if (cond.eventField && $.inArray(cond.eventField, pageEvent.event_fields) < 0) {
          continue;
        }
        if (cond.eventArea && $.inArray(cond.eventArea, pageEvent.event_area) < 0) {
          continue;
        }

        var eventDateString = '';
        if (cond.eventTimeEnd) {
          if (pageEvent.event_date_type_id == 0) {
            var startDatetime = pageEvent.event_start_datetime ? new Date(pageEvent.event_start_datetime) : false;
            var endDatetime = pageEvent.event_end_datetime ? new Date(pageEvent.event_end_datetime) : false;
            if (startDatetime && endDatetime) {
              if (startDatetime.getTime() > cond.eventTimeEnd || endDatetime.getTime() <= now) {
                continue;
              }
              eventDateString = cmsDynDateFormat(startDatetime, cond.eventDateFormat) + '・・ + cmsDynDateFormat(endDatetime, cond.eventDateFormat);
            } else if (startDatetime) {
              if (startDatetime.getTime() > cond.eventTimeEnd) {
                continue;
              }
            } else {
              if (endDatetime.getTime() <= now) {
                continue;
              }
              eventDateString = '・・ + cmsDynDateFormat(endDatetime, cond.eventDateFormat);
            }
          } else if (pageEvent.event_date_type_id == 1) {
            var filteredDates = $.grep(pageEvent.event_dates, function(value, index) {
              var eventTime1 = new Date(value[0]+'T00:00:00+09:00').getTime();
              var eventTime2 = new Date(value[1]+'T23:59:59+09:00').getTime();
              return (eventTime1 <= cond.eventTimeEnd && eventTime2 >= now);
            });
            if (filteredDates.length == 0) {
              continue;
            }
          }
        }
        if (pageEvent.event_place) {
          entity.find('.pageEventPlaceExists').css('display', '');
          entity.find('.pageEventPlace').text(pageEvent.event_place);
        } else {
          entity.find('.pageEventPlaceExists').css('display', 'none');
          entity.find('.pageEventPlace').text('');
        }
        if (pageEvent.event_date_supplement) {
          entity.find('.pageEventDateExists').css('display', '');
          entity.find('.pageEventDate').text(pageEvent.event_date_supplement);
        } else if (eventDateString.length > 0) {
          entity.find('.pageEventDateExists').css('display', '');
          entity.find('.pageEventDate').text(eventDateString);
        } else {
          entity.find('.pageEventDateExists').css('display', 'none');
          entity.find('.pageEventDate').text('');
        }

        if (pageEvent.event_type_name) {
          entity.find('.pageEventTypeExists').css('display', '');
          entity.find('.pageEventType').text(pageEvent.event_type_name);
        } else {
          entity.find('.pageEventTypeExists').css('display', 'none');
          entity.find('.pageEventType').text('');
        }
        if (pageEvent.event_fields && pageEvent.event_fields.length > 0) {
          entity.find('.pageEventFieldsExists').css('display', '');
          entity.find('.pageEventFields').text(pageEvent.event_fields.join(cond.joinGrue));
        } else {
          entity.find('.pageEventFieldsExists').css('display', 'none');
          entity.find('.pageEventFields').text('');
        }
        if (pageEvent.event_area && pageEvent.event_area.length > 0) {
          entity.find('.pageEventAreaExists').css('display', '');
          entity.find('.pageEventArea').text(pageEvent.event_area.join(cond.joinGrue));
        } else {
          entity.find('.pageEventAreaExists').css('display', 'none');
          entity.find('.pageEventArea').text('');
        }
        entity.find('.pageEventExists').css('display', '');
      } else {
        entity.find('.pageEventExists').css('display', 'none');
      }

      entity.find('.pageDate').each(function() {
        var dateString = cmsDynDateFormat(itemDate, cond.dateFormat);
        $(this).text(dateString);
      });
      var pageLink = entity.find('a.pageLink');
      if (cond.curPageNo == item.page_no) {
        pageLink.removeAttr('href').removeAttr('page_no').css('display', 'none');
        pageLink.parent().append('<span class="pageNoLink">' + item.page_name + '</span>');
      } else {
        pageLink.attr('href', item.url).append('<span class="title-text">' + item.page_name + '</span>');
        pageLink.find('.pageNoLink').remove();
      }

      entity.find('.pageDescription').text(item.description);

      if ('thumbnail_image' in item && item.thumbnail_image) {
        entity.find('.pageThumbnail').append($('<img>', {src: item.thumbnail_image, alt: ""}));
      } else {
        entity.find('.pageThumbnail').remove();
      }

      if (cond.recentBegin && itemDate.getTime() >= cond.recentBegin) {
        entity.find('.pageRecent').css('display', '');
      } else {
        entity.find('.pageRecent').css('display', 'none');
      }

      // 繧ｿ繧ｰ莉倅ｸ・      if ('tag' in item && item.tag) {
        if (item.tag.length > 0) {
          var DEFINE_CLASS_NAME_WHEN_TAG_TYPE_IMAGE = 'tag-type-image';
          var DEFINE_CLASS_NAME_WHEN_TAG_TYPE_TEXT = 'tag-type-text';
          var DEFINE_CLASS_NAME_WHEN_TAG_POSITION_BEFORE = 'tag-pos-before';
          var DEFINE_CLASS_NAME_WHEN_TAG_POSITION_AFTER = 'tag-pos-after';
          var DEFINE_CLASS_NAME_TAG_BLOCK = 'tags';
          var DEFINE_CLASS_NAME_TAG = 'tag';
          var DEFINE_CLASS_NAME_TAG_INNER = 'tag-bg';

          // 繧ｿ繧ｰ縺ｮ陦ｨ遉ｺ菴咲ｽｮ繧貞愛螳・          var tagPositionClassName = (cond.tagPosition == 1) ? DEFINE_CLASS_NAME_WHEN_TAG_POSITION_BEFORE : DEFINE_CLASS_NAME_WHEN_TAG_POSITION_AFTER;

          // 繧ｿ繧ｰ蜃ｺ蜉帙・螟匁棧繧堤函謌・          var tagListWrapperHtml = $('<span>', {
            class: [DEFINE_CLASS_NAME_TAG_BLOCK, tagPositionClassName].join(' ')
          });

          item.tag.forEach(function(tagItem, idx) {
            // 繧ｿ繧ｰ縺ｮ荳ｭ霄ｫ繧定ｨｭ螳・            var tagBody;
            if (tagItem.image_file_name != null && tagItem.image_file_name != "") {
              // 逕ｻ蜒・              tagBody = $('<span>', {
                class: DEFINE_CLASS_NAME_TAG + tagItem.tag_no,
              }).append($('<img>', {
                class: [DEFINE_CLASS_NAME_TAG_INNER, DEFINE_CLASS_NAME_WHEN_TAG_TYPE_IMAGE].join(' '),
                src: tagItem.image_url,
                alt: tagItem.tag_name
              }));
            } else {
              // 繝・く繧ｹ繝・              tagBody = $('<span>', {
                class: DEFINE_CLASS_NAME_TAG + tagItem.tag_no,
              }).append($('<span>', {
                class: [DEFINE_CLASS_NAME_TAG_INNER, DEFINE_CLASS_NAME_WHEN_TAG_TYPE_TEXT].join(' '),
                text: tagItem.tag_name
              }));
            }
            tagListWrapperHtml.append(tagBody);
          });

          // 蜃ｺ蜉・          if (cond.tagDisplay == 1) {
            if (tagPositionClassName === DEFINE_CLASS_NAME_WHEN_TAG_POSITION_BEFORE) {
              entity.find('a.pageLink').before(tagListWrapperHtml);
            } else {
              entity.find('a.pageLink').after(tagListWrapperHtml);
            }
          }
        }
      }

      var removeClasses = [];
      var appendClasses = [];
      if (item.is_category_index) {
        appendClasses = cond.dirClass ? cond.dirClass.split(' ') : [];
        removeClasses = cond.pageClass ? cond.pageClass.split(' ') : [];
      } else {
        removeClasses = cond.dirClass ? cond.dirClass.split(' ') : [];
        appendClasses = cond.pageClass ? cond.pageClass.split(' ') : [];
      }
      $.each(removeClasses, function(idx, val){
        entity.removeClass(val);
      });
      $.each(appendClasses, function(idx, val){
        entity.addClass(val);
      });

      entity.css('display', '');
      list.append(entity);
      count++;
      if (cond.limit && count >= cond.limit) {
        break;
      }
    }
    if (count) {
      block.css('display', '');
      block.find('.pageListExists').css('display', '');
      block.find('.pageListNotExists').css('display', 'none');
    } else {
      block.css('display', '');
      block.find('.pageListExists').css('display', 'none');
      block.find('.pageListNotExists').css('display', '');
    }
  };
</script>

<script>
$(function() {
  cmsDynExecuteGetPageList();
});
</script>
