# 新着キャッチ — published subsidy 記事の一次情報（sourceLinks[0]、毎日全件）と
# 全国市区町村トップページ（1,718件、data/watch/README.md 参照）を diff 監視し、
# 変更があれば GitHub Issue で通知する。記事の自動生成・自動publishedは行わない
# （AGENTS.md 絶対規則7・9 — 数値の書き換えは人が原文を確認してから）。
#
# 市区町村トップページは1,718件を毎日全件回すと30分近くかかるため、曜日で7分割し
# その日の分だけをチェックする（scripts/watch-municipalities.ts --weekday）。
# トップページの diff はイベント告知・採用・防災など補助金と無関係な変更が大半のため、
# TYPESAFE_API_KEY がある場合のみ --filter-relevance で Issue 対象を絞り込む
# （src/lib/sources/relevance.ts。判定できなかった変更は取りこぼさないよう残す）。
# GitHub Actions のランナーはUTCのため、cron発火時刻(22:00 UTC=07:00 JST翌日)の
# UTC曜日をそのまま使うとJSTの曜日と1日ずれる。JSTの曜日をワークフロー側で計算して渡す。
name: Watch Municipalities (新着キャッチ)

on:
  schedule:
    - cron: "0 22 * * *" # 毎日 07:00 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "状態ファイルを更新せず確認のみ"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: watch-municipalities
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # .cache/monitor-state.json を実行間で維持（毎回「初期化」にならないように）
      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: .cache/monitor-state.json
          key: municipalities-monitor-state-${{ github.run_id }}
          restore-keys: |
            municipalities-monitor-state-

      - name: Compute JST weekday
        id: jst
        run: echo "weekday=$(TZ=Asia/Tokyo date +%w)" >> "$GITHUB_OUTPUT"

      # TYPESAFE_API_KEY 未設定のリポジトリでも動くよう、鍵がある時だけ絞り込みを有効にする
      - name: Run watcher
        id: watch
        run: |
          filter=""
          if [ -n "$TYPESAFE_API_KEY" ]; then filter="--filter-relevance"; fi
          npm run watch:municipalities --silent -- ${{ inputs.dry_run && '--dry-run' || '' }} --weekday ${{ steps.jst.outputs.weekday }} $filter --github-issue --report watch-report.md

      - name: Save monitor state
        if: ${{ !inputs.dry_run }}
        uses: actions/cache/save@v4
        with:
          path: .cache/monitor-state.json
          key: municipalities-monitor-state-${{ github.run_id }}

      - name: Ensure labels
        run: |
          gh label create "content-opportunity" --color "0E8A16" --description "一次情報の変更/新着 → 記事機会" --force
          gh label create "priority:P1" --color "FBCA04" --force
