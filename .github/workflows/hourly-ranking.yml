# DataForSEO で拾った検索キーワードを起点に、Claude Code（headless, claude -p）が
# Web調査して /ranking のTOP5記事を作成し、main にコミットする。
# 数値・順位はAIが調査せず創作することを禁止している（.claude/agents/ranking-writer.md 参照）。
#
# 本番反映はこのジョブでは行わない（2026-09-26）。bot の push は deploy-xserver.yml の on.push を連鎖起動しないため、
# 以前はここでビルド→rsync までしていたが、配信を deploy-xserver.yml の毎日 06:00 JST の schedule 実行に集約した
# （デプロイのたびに全ページの Last-Modified が更新されクロール予算を消費していたため — docs/17）。
#
# GitHub Secrets:
#   DATAFORSEO_TOKEN    = .env.local の DataForSEO と同じ値（"login:password" の base64）
#   ANTHROPIC_API_KEY   = Claude Code headless 実行用の Anthropic API キー
name: Ranking Article (daily)

on:
  schedule:
    - cron: "0 20 * * *" # 毎日 05:00 JST（deploy-xserver.yml の 06:00 JST 定期配信の前）
  workflow_dispatch:

concurrency:
  group: ranking-article
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Restore ranking-seen cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/ranking-seen.json
          key: ranking-seen-${{ github.run_id }}
          restore-keys: |
            ranking-seen-

      - name: Pick ranking keyword
        id: keyword
        env:
          DataForSEO: ${{ secrets.DATAFORSEO_TOKEN }}
        run: |
          if npm run ranking:pick-keyword; then
            echo "picked=true" >> "$GITHUB_OUTPUT"
          else
            echo "picked=false" >> "$GITHUB_OUTPUT"
            echo "候補キーワードなし。今回はスキップします。"
          fi

      - name: Install Claude Code
        if: steps.keyword.outputs.picked == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # ranking-writer エージェント(.claude/agents/ranking-writer.md)に headless で調査・執筆させる。
      # WebSearch/WebFetch/Read/Write/Glob/Grep/Bash のみ許可し、質問なしで完結させる。
      - name: Research and write ranking article
        id: generate
        if: steps.keyword.outputs.picked == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "ranking-writerエージェントの指示に従い、.cache/ranking-keyword.jsonのキーワードでTOP5ランキング記事を作成してください。" \
            --agent ranking-writer \
            --model claude-sonnet-5 \
            --setting-sources project \
            --allowedTools "Read,Write,Glob,Grep,WebSearch,WebFetch" \
            --dangerously-skip-permissions \
            --output-format text

          git add content/ranking/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save ranking-seen cache
        uses: actions/cache/save@v4
        with:
          path: .cache/ranking-seen.json
          key: ranking-seen-${{ github.run_id }}

      - name: Validate generated content
        if: steps.generate.outputs.changed == 'true'
        run: npm run validate:ranking

      - name: Commit
        if: steps.generate.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(ranking): DataForSEOキーワードを調査してTOP5記事を作成"

      # 品質ゲート: frontmatter 検証（legalBasis 無し公開記事はここで落ちる）
      - name: Validate all content
        if: steps.generate.outputs.changed == 'true'
        run: npm run validate:content

      - name: Push
        if: steps.generate.outputs.changed == 'true'
        run: |
          # 他セッションが同時に main へ push することがあるため、拒否されたら rebase して再試行する
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected, retry $i/5"
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          echo "::error::git push が5回失敗しました"
          exit 1
