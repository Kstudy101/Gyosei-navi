# 本番デプロイ: main への push、または毎日 06:00 JST の schedule → 静的 export → SSH + rsync で Xserver public_html へ差分同期
# （bot が生成した compare/tokushu/ranking 記事は push では連鎖起動しないため、schedule 実行で 1 日 1 回まとめて配信する — docs/17）
#
# GitHub Secrets（リポジトリ Settings → Secrets and variables → Actions）:
#   XSERVER_HOST        = sv####.xserver.jp   （サーバーパネル「サーバー情報」ホスト名）
#   XSERVER_USER        = サーバーID           （例 xs123456）
#   XSERVER_PORT        = 10022               （Xserver の SSH ポート）
#   XSERVER_SSH_KEY     = 秘密鍵（OpenSSH/PEM 形式の全文）。公開鍵は Xserver「SSH設定」に登録
#   XSERVER_PASSPHRASE  = 秘密鍵のパスフレーズ（Xserver パネルで生成した鍵など。無ければ未設定でよい）
#   XSERVER_KNOWN_HOSTS = 任意。`ssh-keyscan -p 10022 sv####.xserver.jp` の出力。無ければ初回接続時に取得
# Variables（任意）: XSERVER_DEPLOY_DIR（既定 ~/gyosei-navi.jp/public_html）, NEXT_PUBLIC_GA4_ID, NEXT_PUBLIC_CLARITY_ID
#   お問い合わせフォーム: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY（値は公開可、Edge Function 呼び出し用）
#   Rakuten Affiliate: RAKUTEN_AFFILIATE_ENABLED / RAKUTEN_API_AD_ENABLED / RAKUTEN_MOTION_WIDGET_ENABLED,
#     RAKUTEN_AFFILIATE_ID, RAKUTEN_MOTION_WIDGET_ID（値そのものは静的HTMLに埋め込まれる — 秘密情報ではない。
#     RAKUTEN_APP_ID はここでは不要 — npm run ads:rakuten はローカルで事前実行し data/ads/rakuten/*.json をコミットする運用）
# 手順書: docs/11_DEPLOY_XSERVER.md
name: Deploy to Xserver

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "prompts/**"
      - "data/**"
      - "infra/**"
      - "scripts/monitor.ts"
      - "scripts/watch-pubcomment.ts"
      - "**/*.md"
  schedule:
    - cron: "0 21 * * *" # 毎日 06:00 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "rsync --dry-run（転送せず差分だけ表示）"
        type: boolean
        default: false

concurrency:
  group: deploy-xserver
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SSH_PORT: ${{ secrets.XSERVER_PORT || '10022' }}
      DEPLOY_DIR: ${{ vars.XSERVER_DEPLOY_DIR || '~/gyosei-navi.jp/public_html' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 品質ゲート: frontmatter 検証（legalBasis 無し公開記事はここで落ちる）
      - run: npm run validate:content

      # OG画像の自動生成。manifest.json の入力ハッシュで変更記事のみ再生成するため、
      # キャッシュ復元時はほぼスキップされる（scripts/generate-og-images.ts）
      - name: Restore OG image cache
        uses: actions/cache@v4
        with:
          path: public/og/auto
          key: og-auto-${{ hashFiles('content/**/*.mdx', 'scripts/generate-og-images.ts') }}
          restore-keys: |
            og-auto-

      - name: Generate OG images
        run: npm run og:generate

      # 静的 export（out/）。計測IDは production ビルド時に埋め込まれる
      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_GA4_ID: ${{ vars.NEXT_PUBLIC_GA4_ID }}
          NEXT_PUBLIC_CLARITY_ID: ${{ vars.NEXT_PUBLIC_CLARITY_ID }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          RAKUTEN_AFFILIATE_ENABLED: ${{ vars.RAKUTEN_AFFILIATE_ENABLED }}
          RAKUTEN_API_AD_ENABLED: ${{ vars.RAKUTEN_API_AD_ENABLED }}
          RAKUTEN_MOTION_WIDGET_ENABLED: ${{ vars.RAKUTEN_MOTION_WIDGET_ENABLED }}
          RAKUTEN_AFFILIATE_ID: ${{ vars.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_MOTION_WIDGET_ID: ${{ vars.RAKUTEN_MOTION_WIDGET_ID }}

      - name: Sanity check out/
        run: |
          test -f out/index.html && test -f out/sitemap.xml && test -f out/.htaccess
          echo "files: $(find out -type f | wc -l), size: $(du -sh out | cut -f1)"

      # Xserver 契約前（Secrets 未登録）はビルド検証だけで正常終了させる
      - name: Check SSH secrets
        id: secrets
        run: |
          if [ -n "${{ secrets.XSERVER_HOST }}" ] && [ -n "${{ secrets.XSERVER_USER }}" ] && [ -n "${{ secrets.XSERVER_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::XSERVER_HOST / XSERVER_USER / XSERVER_SSH_KEY のいずれかが未登録のためデプロイをスキップ（ビルドは成功）。docs/11 §1-3 参照"
          fi

      - name: Set up SSH
        if: steps.secrets.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.XSERVER_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.XSERVER_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.XSERVER_HOST }}
          SSH_USER: ${{ secrets.XSERVER_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # 改行が \n リテラルや CRLF になっていても復元する
          printf '%s\n' "$SSH_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # パスフレーズ付き鍵（Xserver パネル生成など）は runner 内で外して使う
          if [ -n "$SSH_PASSPHRASE" ]; then
            ssh-keygen -p -P "$SSH_PASSPHRASE" -N "" -f ~/.ssh/deploy_key >/dev/null
          fi
          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub
          echo "deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key.pub | cut -d' ' -f2)"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # keyscan は稀に一時失敗する（2026-08-17 run 32018144397: 無出力で exit 1 → -e で即中断）ためリトライ
            for i in 1 2 3; do
              ssh-keyscan -T 15 -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts && break
              echo "ssh-keyscan retry $i/3"; sleep 5
            done
            if [ ! -s ~/.ssh/known_hosts ]; then
              echo "::error::ssh-keyscan が 3 回失敗（ホスト鍵を取得できず）。XSERVER_KNOWN_HOSTS Secret の登録で回避可能"
              exit 1
            fi
            echo "::warning::XSERVER_KNOWN_HOSTS 未設定 → ssh-keyscan で取得（TOFU）。固定化するには Secrets に登録してください"
          fi
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host xserver
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config
          ssh -o BatchMode=yes xserver 'echo "ssh ok: $(hostname) rsync=$(command -v rsync || echo MISSING)"'

      # rsync 差分同期。--delete で消えたページをサーバーからも削除（.well-known 等は保護）
      - name: Deploy via rsync
        if: steps.secrets.outputs.ready == 'true'
        run: |
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          ssh xserver "mkdir -p $DEPLOY_DIR"
          # --checksum --no-times: ビルドは毎回ファイルを書き直すので mtime では差分が取れない。内容が同じ
          # ファイルはサーバー側の mtime（= Last-Modified）を保ち、変わったページだけ転送する
          # （next.config.ts の generateBuildId 固定とセット — docs/17）。
          rsync -az --no-times --checksum --delete $DRY \
            --itemize-changes --stats \
            --exclude '.well-known/' \
            --exclude '.user.ini' \
            --exclude '.ftp-deploy-sync-state.json' \
            -e ssh \
            ./out/ "xserver:$DEPLOY_DIR/"

      - name: Verify live site
        if: steps.secrets.outputs.ready == 'true' && inputs.dry_run != true
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" https://gyosei-navi.jp/ || echo "000")
          echo "https://gyosei-navi.jp/ → $code"
          # DNS/SSL 未反映の初期は失敗しても止めない（本文ログで確認）

      # IndexNow: 今回の push で変更された published 記事URLを検索エンジンへ通知（Bing 等の
      # インデックシング加速）。失敗しても deploy は成功扱い（付加機能のため）
      - name: Submit changed articles to IndexNow
        if: steps.secrets.outputs.ready == 'true' && inputs.dry_run != true && github.event_name == 'push'
        continue-on-error: true
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || echo "$BEFORE" | grep -qE '^0+$'; then
            echo "基準コミットなし（新規ブランチ等）— スキップ"; exit 0
          fi
          # checkout は depth=1 のため比較対象コミットだけ追加取得する
          git fetch --no-tags --depth=1 origin "$BEFORE" || { echo "基準コミット取得失敗 — スキップ"; exit 0; }
          CHANGED=$(git diff --name-only --diff-filter=d "$BEFORE" HEAD -- content content-i18n | grep '\.mdx$' || true)
          if [ -z "$CHANGED" ]; then echo "変更記事なし — スキップ"; exit 0; fi
          node scripts/indexnow-submit.mjs $CHANGED
