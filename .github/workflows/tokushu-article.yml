# 既存published subsidy記事のデータをもとに、
# AIを呼ばず純粋スクリプト（generate-tokushu.ts）で /tokushu の特集記事を更新し、main にコミットする。
# 「2次加工」記事のため AGENTS.md 絶対規則9の例外（人手レビュー・数値対照なしで自動published）を適用する。
#
# hourly-ranking.yml と違い claude -p は呼ばない（新規Web調査ではなく既存データの再構成のため、
# API費用ゼロで実行できる）。
#
# 本番反映はこのジョブでは行わない（2026-09-26）。bot の push は deploy-xserver.yml の on.push を連鎖起動しないため、
# 以前はここでビルド→rsync までしていたが、配信を deploy-xserver.yml の毎日 06:00 JST の schedule 実行に集約した
# （デプロイのたびに全ページの Last-Modified が更新されクロール予算を消費していたため — docs/17）。
name: Tokushu Article (daily)

on:
  schedule:
    - cron: "55 19 * * *" # 毎日 04:55 JST（deploy-xserver.yml の 06:00 JST 定期配信の前）
  workflow_dispatch:

concurrency:
  group: tokushu-article
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate tokushu article
        id: generate
        run: |
          npm run generate:tokushu --silent
          git add content/tokushu/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate all content
        if: steps.generate.outputs.changed == 'true'
        run: npm run validate:content

      - name: Commit
        if: steps.generate.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(tokushu): 既存published記事を再構成した特集記事を自動更新"

      - name: Push
        if: steps.generate.outputs.changed == 'true'
        run: |
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected, retry $i/5"
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          echo "::error::git push が5回失敗しました"
          exit 1
