# 官報 일일 아카이빙 (TASK-09)
#   官報 전자판은 발행(매일 08:30 JST) 후 90일만 무료 공개 → 매일 자동 취득.
#   - 추출 텍스트 → data/kanpo-text/ 에 커밋 (키워드 검색용 영구 아카이브)
#   - PDF 원본   → Release 자산 (태그 kanpo-YYYY-MM, 리포 비대화 방지)
#   - 멱등: 텍스트 파일이 이미 있는 号는 스킵 → 결측일은 다음 실행(7일 백필 창)에서 자동 회수
#   - 실패는 monitoring-failure Issue (놓친 날은 90일 후 영구 복구 불가)
name: Kanpo Archive

on:
  schedule:
    - cron: "0 0 * * *" # 00:00 UTC = 09:00 JST
  workflow_dispatch:
    inputs:
      days:
        description: "백필 일수 (색인은 직근 90일까지)"
        default: "7"
      force_pdf:
        description: "텍스트가 있어도 PDF 원본이 없으면 재취득 (업로드 실패 복구용)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: kanpo-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Archive kanpo issues
        run: npm run kanpo --silent -- --days ${{ inputs.days || '7' }} --manifest .cache/kanpo-new.txt ${{ inputs.force_pdf && '--force-pdf' || '' }}

      - name: Commit extracted text
        run: |
          if [ -n "$(git status --porcelain data/kanpo-text)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/kanpo-text
            git commit -m "kanpo: $(date -u +%Y-%m-%d) 官報テキストアーカイブ"
            git pull --rebase origin main
            git push
          else
            echo "新規テキストなし"
          fi

      # gh release view/upload (REST GET) 는 간헐 404 장애가 확인됨 (2026-08-17)
      # → GraphQL 로 release id 를 얻고 uploads API 에 직접 POST 한다 (장애 중에도 동작 확인)
      - name: Upload PDFs to release
        run: |
          if [ ! -s .cache/kanpo-new.txt ]; then echo "新規PDFなし"; exit 0; fi
          OWNER="${GITHUB_REPOSITORY%/*}"; REPO="${GITHUB_REPOSITORY#*/}"
          release_id() {
            gh api graphql -f query="{repository(owner:\"$OWNER\",name:\"$REPO\"){release(tagName:\"$1\"){databaseId}}}" \
              -q '.data.repository.release.databaseId' 2>/dev/null || true
          }
          fail=0
          while IFS= read -r f || [ -n "$f" ]; do
            [ -f "$f" ] || continue
            # .cache/kanpo/YYYY/MM/DD/xxx.pdf → 태그 kanpo-YYYY-MM
            ym=$(echo "$f" | sed -E 's#.*kanpo[/\\]([0-9]{4})[/\\]([0-9]{2}).*#\1-\2#')
            tag="kanpo-$ym"
            rid=$(release_id "$tag")
            if [ -z "$rid" ] || [ "$rid" = "null" ]; then
              gh release create "$tag" --title "官報アーカイブ $ym" \
                --notes "官報 PDF 원본 아카이브 ($ym). 추출 텍스트는 data/kanpo-text/ 참조." || true
              rid=$(release_id "$tag")
            fi
            if [ -z "$rid" ] || [ "$rid" = "null" ]; then
              echo "::error::release id 취득 실패: $tag"; fail=1; continue
            fi
            name=$(basename "$f")
            code=$(curl -s -o /tmp/up.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/pdf" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$rid/assets?name=$name")
            case "$code" in
              201) echo "uploaded: $tag <- $name" ;;
              422) echo "exists:   $tag <- $name (既存のためスキップ)" ;;
              *)   echo "::error::upload $name -> HTTP $code"; head -c 300 /tmp/up.json; echo; fail=1 ;;
            esac
          done < .cache/kanpo-new.txt
          exit $fail

      - name: Create issue on failure
        if: failure()
        run: |
          gh issue create \
            --title "[監視失敗] kanpo-archive $(date -u +%Y-%m-%d)" \
            --body "官報アーカイブに失敗しました。**発行後90日で公開終了 — 放置すると永久喪失** です。
          ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "monitoring-failure"
