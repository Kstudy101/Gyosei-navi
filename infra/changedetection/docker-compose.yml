# changedetection.io + browserless/chrome (TASK-04)
# JS レンダリングページ（jGrants 等）と PDF 更新の監視用。
#   docker compose up -d
#   http://localhost:${CHANGEDETECTION_PORT:-5000}
services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:latest
    container_name: changedetection
    hostname: changedetection
    restart: unless-stopped
    ports:
      - "${CHANGEDETECTION_PORT:-5000}:5000"
    volumes:
      - changedetection-data:/datastore
    environment:
      # browserless (Chrome) で JS レンダリング
      - PLAYWRIGHT_DRIVER_URL=ws://browserless:3000/chrome?stealth=1&--disable-web-security=true
      - BASE_URL=${CHANGEDETECTION_BASE_URL:-http://localhost:5000}
      - TZ=Asia/Tokyo
      # 監視対象は官公庁。負荷を掛けない間隔で（分単位）
      - MINIMUM_SECONDS_RECHECK_TIME=3600
      # 通知先などの秘密は .env に置く（コミット禁止）
      - WEBDRIVER_URL=
    depends_on:
      - browserless

  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: browserless
    hostname: browserless
    restart: unless-stopped
    environment:
      - SCREEN_WIDTH=1280
      - SCREEN_HEIGHT=1024
      - SCREEN_DEPTH=16
      - ENABLE_DEBUGGER=false
      - PREBOOT_CHROME=true
      - CONNECTION_TIMEOUT=300000
      - MAX_CONCURRENT_SESSIONS=3
      - CHROME_REFRESH_TIME=600000
      - DEFAULT_BLOCK_ADS=true
      - DEFAULT_STEALTH=true
      - TZ=Asia/Tokyo

volumes:
  changedetection-data:
